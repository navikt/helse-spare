spec:
  resources:
    limits:
      memory: 256Mi
    requests:
      memory: 196Mi
  replicas:
    max: 1
    cpuThresholdPercentage: 90
  kafka:
    pool: nav-dev
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: db-f1-micro
        diskAutoresize: true
        pointInTimeRecovery: true
        name: spare
        databases:
          - name: spare
            envVarPrefix: DATABASE
