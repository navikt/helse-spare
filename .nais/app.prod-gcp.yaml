spec:
  preStopHook:
    http:
      path: /stop
  resources:
    limits:
      memory: 368Mi
    requests:
      memory: 368Mi
  replicas:
    max: 6
    scalingStrategy:
      kafka:
        topic: tbd.rapid.v1
        consumerGroup: tbd-spare-v1
        threshold: 200
  kafka:
    pool: nav-prod
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        pointInTimeRecovery: true
        name: spare2
        tier: db-custom-1-3840
        databases:
          - name: spare
            envVarPrefix: DATABASE
            users:
              - name: bigquery-connection-user
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
